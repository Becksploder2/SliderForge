name: Build SliderForge Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow pyinstaller
      - name: Compile source
        run: |
          python -m py_compile SliderForge.py branding.py updater.py
      - name: Build Windows app
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SliderForge --add-data "cfb27_official_ratings.csv;." SliderForge.py
      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SliderForge-Windows
          path: dist/SliderForge.exe
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SliderForge.exe
          prerelease: true
          generate_release_notes: true
