name: Build SliderForge Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build standalone executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SliderForge --add-data "cfb27_official_ratings.csv;." --hidden-import=team_background --hidden-import=branding SliderForge.py
      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/SliderForge.exe package/
          Copy-Item README_v1_3.md package/ -ErrorAction SilentlyContinue
          Compress-Archive -Path package/* -DestinationPath SliderForge-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SliderForge-Windows
          path: SliderForge-Windows.zip
